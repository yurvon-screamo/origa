# =============================================================================
# Qlty Configuration for Origa Project
# =============================================================================
# Tech Stack: Rust workspace (origa, utils, tokenizer) + Leptos/WASM (origa_ui) +
#             Tauri v2 desktop (tauri) + Playwright E2E (end2end)
# =============================================================================

config_version = "0"

# =============================================================================
# EXCLUDE PATTERNS
# =============================================================================
exclude_patterns = [
    # ----- Rust Build Artifacts -----
    "**/target/**",
    "**/Cargo.lock",

    # ----- WASM / Leptos -----
    "**/dist/**",
    "**/dist-gen/**",
    "**/pkg/**",
    "**/*.wasm",
    "**/*.wat",

    # ----- Tauri -----
    "**/src-tauri/target/**",
    "**/*.exe",

    # ----- Node / TypeScript -----
    "**/node_modules/**",
    "**/.yarn/**",
    "**/*.min.*",
    "**/*_min.*",
    "*-min.*",

    # ----- Generated Files -----
    "**/generated/**",
    "**/*.generated.rs",
    "**/*.generated.ts",
    "**/*.d.ts",

    # ----- E2E Test Artifacts -----
    "**/end2end/test-results/**",
    "**/end2end/playwright-report/**",
    "**/end2end/.playwright/**",

    # ----- IDE / Editor -----
    "**/.vscode/**",
    "**/.idea/**",

    # ----- Version Control -----
    "**/.git/**",

    # ----- qlty runtime state -----
    # Every qlty run writes .qlty/out/invoke-*.yaml; without this exclude a
    # formatter (prettier) inside the SAME run would flag those untracked
    # files as unformatted — a nondeterministically red gate on its own
    # artifacts (reproduced; .gitignore carries the same entry).
    ".qlty/out/**",

    # ----- Misc -----
    "**/assets/**",
    "**/cache/**",
    "**/protos/**",
    "**/testdata/**",

    # ----- Marketing -----
    # Marketing copy (playbooks, research notes) is prose, not engineering
    # source. Markdownlint rules for blank-line spacing, bare URLs and table
    # alignment are enforced by the editorial pipeline rather than qlty;
    # blocking pushes here traps the marketing workflow on local machines.
    "docs/marketing/playbooks/**",
    "docs/marketing/research/**",
    "docs/marketing/strategies/**",

    # ----- Prose & generated artifacts (formatter scope) -----
    # Markdown is prose everywhere in this repo (docs, ADRs, READMEs, LLM
    # prompts, translator/HF copy): reformatting it risks render degradation
    # (table/list reflow, fenced-block churn) and has no gate value —
    # markdownlint runs in monitor mode (never a merge stopper). This
    # excludes *.md from formatter AND markdownlint scans globally.
    "**/*.md",
    # Machine-generated / archival files: their bytes are owned by their
    # pipeline (npm install, factcheck generator, point-in-time snapshots).
    "origa_landing/content/**",
    "**/package-lock.json",
    "origa_landing/style/landing.processed.css",
    "docs/backups/**",
    "docs/.factcheck/**",
]

# =============================================================================
# TEST PATTERNS
# =============================================================================
test_patterns = [
    # ----- Rust Tests -----
    "**/tests/**",
    "**/*_test.rs",
    "**/*_tests.rs",
    "**/src/**/tests/**",

    # ----- Playwright E2E -----
    "**/end2end/**/*.spec.ts",
    "**/end2end/**/*.test.ts",
    "**/e2e/**/*.spec.ts",

    # ----- General Test Patterns -----
    "**/test/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test_*.*",
]

# =============================================================================
# SMELL DETECTION
# =============================================================================
[smells]
mode = "comment"

[smells.function_complexity]
threshold = 20

[smells.function_parameters]
threshold = 6

[smells.return_statements]
threshold = 8

[smells.nested_control_flow]
threshold = 6

[smells.boolean_logic]
threshold = 6

[smells.duplication]
nodes_threshold = 60

# =============================================================================
# COVERAGE CONFIGURATION
# =============================================================================
[coverage]
ignores = [
    "**/*.generated.rs",
    "**/*.generated.ts",
    "**/fixtures/**",
    "**/mocks/**",
    "**/end2end/**",
]

# =============================================================================
# SOURCE CONFIGURATION
# =============================================================================
[[source]]
name = "default"
default = true

# =============================================================================
# PLUGINS
# =============================================================================

# ----- RUST ECOSYSTEM -----
[[plugin]]
name = "clippy"
mode = "comment"

# ----- SECURITY SCANNING (HIGH PRIORITY) -----
# DISABLED: Memory allocation error on Windows (wazero WebAssembly issue)
# [[plugin]]
# name = "gitleaks"
# mode = "block"

[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "osv-scanner"
mode = "monitor"

[[plugin]]
name = "semgrep"
mode = "comment"

# ----- INFRASTRUCTURE / IaC -----
[[plugin]]
name = "actionlint"
mode = "comment"

[[plugin]]
name = "hadolint"
mode = "comment"

[[plugin]]
name = "shellcheck"
mode = "comment"

# ----- CODE SEARCH -----
[[plugin]]
name = "ripgrep"
mode = "comment"

# ----- DOCUMENTATION -----
[[plugin]]
name = "markdownlint"
mode = "monitor"

# Python: scripts/, tts/, translator/ — ~10k lines with no qlty-side lint
# (the tts/gen_batch.py conflict-marker breakage of #794 is exactly the
# class ruff's parse errors would have caught at commit time).
[[plugin]]
name = "ruff"
mode = "comment"

# -----------------------------------------------------------------------------
# FORMATTERS (gated through `qlty check` formatter findings; owner decision
# 2026-11-08: "форматтер плагины все тоже поставь, пусть гоняется").
#
# NOTE — deliberate deviation from the uwuwu-agent reference config, which
# keeps fmt drivers OFF ("the fmt driver reformats the whole repo"): here the
# formatter gate was explicitly requested. The baseline reformat ships in the
# same PR that enables the gate (see ci.yml Lint job).
# -----------------------------------------------------------------------------

# TS/JS/JSON (+css/html/yaml): end2end/** is the main uncovered surface.
# Prose markdown, lockfiles and the committed landing CSS artifact are
# excluded above (see "Prose & build artifacts").
[[plugin]]
name = "prettier"
mode = "comment"

# Shell: tts/*.sh and .qlty/hooks/*.sh.
[[plugin]]
name = "shfmt"
mode = "comment"

# =============================================================================
# TRIAGE RULES
# =============================================================================

[[triage]]
match.file_patterns = ["**/*.generated.rs"]
set.ignored = true

[[triage]]
match.file_patterns = ["**/src-tauri/**"]
set.level = "low"

[[triage]]
match.file_patterns = ["**/end2end/**"]
set.level = "low"

[[triage]]
match.plugins = ["clippy"]
match.file_patterns = ["**/origa_ui/**"]
set.level = "medium"

[[triage]]
match.plugins = ["ripgrep"]
match.file_patterns = ["**/end2end/**"]
set.ignored = true

# Formatters never touch .github/**: the workflows have their own
# consistent 4-space convention (and cross-PR merge churn on every
# reformat); actionlint and shellcheck still scan these paths — only
# prettier/shfmt rewrite access is turned off here.
[[triage]]
match.plugins = ["prettier"]
match.file_patterns = [".github/**"]
set.ignored = true

[[triage]]
match.plugins = ["shfmt"]
match.file_patterns = [".github/**"]
set.ignored = true

[[triage]]
match.plugins = ["clippy"]
match.rules = ["clippy::arc_with_dispatch"]
set.level = "low"
