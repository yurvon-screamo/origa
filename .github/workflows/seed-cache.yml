# Seed common caches on master
# =============================
#
# PR runs execute on isolated merge-refs (no push->master trigger), so every
# PR saves its own copy of every content-hash cache — ~10.2 GB/day of
# duplicates across active refs against a 10 GB budget (row-id 922). This
# workflow (dispatch + schedule) runs on the DEFAULT branch, so its saves
# land on refs/heads/master; PR runs then exact-hit the master copies and
# skip their own saves. Tag runs exact-hit the un-gated seeds too.
#
# STRUCTURE: one job per family. Post-saves do not run for a failed job,
# so one red family must not cancel the rest.
#
# CONTRACT: every key/path/params here MUST mirror the consumer step exactly
# (seed key == consumer key). Consumers — see the table below; the xwin job
# additionally mirrors the consumer's CONTAINER (cache entries are versioned
# by path string and compression method, so a bare-runner seed is
# unrestorable inside the build image).
#
#   job                   seed family            key pattern                          consumer
#   seed-frontend-tools   frontend-tools         frontend-tools-Linux-X64-*-v1        setup-frontend (composite)
#   seed-qlty             qlty-plugins           qlty-plugins-Linux-v1-<hash>          ci.yml lint
#   seed-playwright       playwright             playwright-chromium-v1-<hash>         ci.yml e2e
#   seed-apt-gtk          apt GTK                cache-apt-pkgs_<hash full list>       ci.yml lint/test/landing-test/wasm-test
#   seed-apt-protobuf     apt protobuf           cache-apt-pkgs_<hash protobuf only>   ci.yml android-smoke
#   seed-uv               uv                     setup-uv-owned key                    ci.yml python-tests
#   seed-wasm-pack        wasm-pack              wasm-pack-Linux-X64-v0.15.0           ci.yml wasm-test
#   seed-trailbase        trailbase              trailbase-<semver from Dockerfile>    ci.yml e2e
#   seed-xwin             xwin                   xwin-Linux-x86_64-pc-windows-msvc-v17 _build-tauri.yml windows (same container)
#   seed-cdn              cdn-data               cdn-data-v15-<hash manifest>          download-cdn (composite)
#   seed-android-gradle   gradle                 Linux-gradle-<hash gradle files>      ci.yml android-smoke
#
# When you change a consumer key/path/pin/container in ci.yml /
# _build-tauri.yml / setup-frontend / setup-rust, change the mirroring seed
# step here in the same PR, otherwise the seed silently orphans (symptom: PR
# duplicates return — they resurface in the cache-budget report of
# cleanup-cache.yml, which stays as the safety net).
#
# Interaction with cleanup-cache.yml: seed keys match family prefixes
# (qlty-plugins-, playwright-, setup-uv-, cdn-data-v15-) or MASTER_SEEDS
# (constant keys); each apt key is its own family (shared family deleted
# GTK/protobuf alternately — see the cleanup comment). A stale apt key is
# NOT reaped by cleanup (always newest-in-family) — it expires via GitHub's
# own 7-day unused-eviction; weight is small, accepted. Idempotency: with
# unchanged content every seed step exact-hits and skips the save.
#
# Out of scope on purpose: macOS/Windows-keyed caches (no cheap seeding
# runner; the 1-day TTL caps their window), CodeQL (GitHub-managed),
# Swatinem/rust-cache entries (no consumer currently saves them).
#
# OPERATIONS (row-id 922 holds the full procedure with live outputs):
#
#   Verify on a branch (saves land on the BRANCH ref, never on master):
#     gh workflow run seed-cache.yml --ref <branch>
#   Check what got seeded:
#     gh api "repos/{owner}/{repo}/actions/caches?per_page=100" \
#       --jq '[.actions_caches[] | {key, ref, size: .size_in_bytes}]'
#
#   Verify on a branch (saves land on the BRANCH ref, never on master):
#     gh workflow run seed-cache.yml --ref <branch>
#   Check what got seeded:
#     gh api "repos/{owner}/{repo}/actions/caches?per_page=100" \
#       --jq '[.actions_caches[] | {key, ref, size: .size_in_bytes}]'
#   A healthy tick = every job green (gradle only builds on a cache miss).
#   A red schedule tick = the seed is not working — look at it the same
#   day: while master copies are missing, PRs keep saving their own copies.
#   Empty-seed smell: an entry of a few hundred bytes under a consumer key
#   (protobuf 653 B, 26-27.11) — delete it
#   (gh api -X DELETE .../actions/caches --field key=... -f ref=refs/heads/master)
#   so the next tick can write real content; exact-hit never overwrites.

name: Seed Caches

on:
    schedule:
        # Twice a day like cleanup-cache.yml (GitHub skips some scheduled
        # runs), ticks offset from the cleanup ones (03:00/15:00 UTC).
        - cron: "30 1 * * *"
        - cron: "30 13 * * *"
    workflow_dispatch:

concurrency:
    group: seed-cache
    cancel-in-progress: true

permissions:
    contents: read

env:
    # Mirror of ci.yml env.GTK_SYSTEM_PACKAGES — keep in sync (see the
    # contract comment at the top).
    GTK_SYSTEM_PACKAGES: "libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler libspeechd-dev"

jobs:
    seed-frontend-tools:
        name: Seed frontend tools (binstall/trunk/tauri-cli)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # The composite owns the keys (per-tool entries, os/arch
            # qualified) — the seed just runs it.
            - name: Setup frontend tools
              uses: ./.github/actions/setup-frontend

    seed-qlty:
        name: Seed qlty plugins
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # --- qlty-plugins (consumer: ci.yml lint)
            - name: Cache qlty plugins
              uses: actions/cache@v6
              with:
                  path: ~/.qlty
                  key: qlty-plugins-Linux-v1-${{ hashFiles('.qlty/qlty.toml') }}

            - name: Install qlty
              run: |
                  curl -fsSL https://qlty.sh | sh
                  echo "$HOME/.qlty/bin" >> "$GITHUB_PATH"
                  "$HOME/.qlty/bin/qlty" --version

            - name: Warm qlty plugins (full-scope run)
              # --all on purpose: the seed must initialize EVERY configured
              # plugin, and a narrow delta might not touch some tools at all
              # — an under-filled seed would exact-hit PR runs forever
              # (post-save never rewrites an exact hit). Runs execute under
              # `bash -e` by default: a non-zero qlty exit (baseline
              # findings + unformatted files on master are the expected
              # state, not a seeding failure) would abort the script before
              # the echo, so errexit is disabled explicitly and the code is
              # reported instead. Plugins download during run initialization
              # regardless of the check verdict; a REAL download failure is
              # caught fail-loud by the assert below.
              run: |
                  set +e
                  qlty check --all --no-fix --no-progress
                  code=$?
                  echo "qlty exit code: ${code} (baseline findings on master are expected, not a seeding failure)"

            - name: Assert qlty plugins downloaded
              run: |
                  tools_dir="$HOME/.qlty/cache/tools"
                  if [ ! -d "$tools_dir" ] || [ -z "$(find "$tools_dir" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                      echo "::error::qlty plugin cache is empty after the warm run — plugins did not download; an empty seed would exact-hit PR runs forever"
                      exit 1
                  fi
                  echo "qlty plugins seeded: $(find "$tools_dir" -mindepth 1 -maxdepth 1 | wc -l) tool dirs"

    seed-playwright:
        name: Seed Playwright browsers
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # --- playwright chromium (consumer: ci.yml e2e)
            - name: Install Node.js dependencies
              working-directory: end2end
              run: npm ci

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-v1-${{ hashFiles('end2end/package-lock.json') }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium
              working-directory: end2end

            - name: Assert Playwright browsers downloaded
              run: |
                  if [ ! -d "$HOME/.cache/ms-playwright" ] || [ -z "$(find "$HOME/.cache/ms-playwright" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                      echo "::error::Playwright browser cache is empty — chromium did not download"
                      exit 1
                  fi

    seed-apt-gtk:
        name: Seed APT packages (GTK stack)
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            # No checkout: nothing here reads the repo (package list comes
            # from the workflow env above, mirroring ci.yml).
            - name: Refresh APT indexes
              run: sudo apt-get update
            # --- apt GTK stack (consumer: ci.yml lint/test/landing-test/wasm-test)
            - name: Cache APT packages (GTK stack)
              uses: awalsh128/cache-apt-pkgs-action@v1.6.3
              with:
                  packages: ${{ env.GTK_SYSTEM_PACKAGES }}
                  version: 1.1  # same bump rationale as ci.yml (stale .pc files)

    seed-apt-protobuf:
        name: Seed APT packages (protobuf-compiler)
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            # No checkout: nothing here reads the repo.
            - name: Refresh APT indexes
              run: sudo apt-get update
            # --- apt protobuf-compiler (consumer: ci.yml android-smoke)
            # The 653 B entry of 26-27.11 was saved when the action had
            # nothing to download: in the old single job the GTK step had
            # already installed protobuf-compiler from GTK_SYSTEM_PACKAGES.
            # Jobs are split now, so this step owns the package — remove
            # first so there is always something to cache, even if a
            # future image ships it preinstalled.
            - name: Remove preinstalled protobuf-compiler
              run: sudo apt-get remove -y protobuf-compiler || true
            - name: Cache APT packages (protobuf-compiler)
              uses: awalsh128/cache-apt-pkgs-action@v1.6.3
              with:
                  packages: protobuf-compiler
                  version: 1.1  # same bump rationale as ci.yml (stale .pc files)
            - name: Assert protobuf-compiler installed
              # awalsh restores from cache by untarring into / WITHOUT dpkg
              # registration, so `dpkg -l` is empty on the (normal) hit path
              # and a dpkg assert would fail every scheduled tick. Binary
              # presence proves the action installed or restored the package.
              run: |
                  if ! command -v protoc > /dev/null 2>&1; then
                      echo "::error::protoc is not on PATH after the cache step — the seed downloaded nothing"
                      exit 1
                  fi
                  protoc --version

    seed-uv:
        name: Seed uv cache
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # --- uv (consumer: ci.yml python-tests; the action owns the key)
            - name: Setup uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  enable-cache: true
                  cache-dependency-glob: scripts/uv.lock

            - name: Install uv dependencies
              run: uv sync --frozen --project scripts

    seed-wasm-pack:
        name: Seed wasm-pack
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            # No checkout: constant key + versioned URL, nothing reads the repo.
            # --- wasm-pack (consumer: ci.yml wasm-test)
            - name: Restore wasm-pack
              id: wasm-pack-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/bin/wasm-pack
                  key: wasm-pack-Linux-X64-v0.15.0

            - name: Install wasm-pack
              if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
              run: |
                  mkdir -p "$HOME/.cargo/bin"
                  curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
                      https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
                      | tar -xz -C "$HOME/.cargo/bin" --strip-components=1 \
                          wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
                  chmod +x "$HOME/.cargo/bin/wasm-pack"

            - name: Verify wasm-pack
              run: |
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  wasm-pack --version

    seed-trailbase:
        name: Seed TrailBase CLI
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # --- trailbase (consumer: ci.yml e2e)
            - name: Read TrailBase version from origa_ui/Dockerfile
              id: trailbase-version
              run: |
                  mapfile -t versions < <(sed -n 's/^ARG TRAILBASE_VERSION=//p' origa_ui/Dockerfile)
                  if [[ ${#versions[@]} -ne 1 || ! "${versions[0]}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::origa_ui/Dockerfile must declare exactly one 'ARG TRAILBASE_VERSION=vX.Y.Z' (got: ${versions[*]:-nothing})"
                      exit 1
                  fi
                  echo "version=${versions[0]}" >> "$GITHUB_OUTPUT"

            - name: Cache TrailBase CLI
              id: cache-trailbase
              uses: actions/cache@v6
              with:
                  path: ~/.local/bin/trail
                  key: trailbase-${{ steps.trailbase-version.outputs.version }}

            - name: Add TrailBase to PATH
              run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Validate TrailBase CLI
              id: validate-trailbase
              env:
                  EXPECTED_VERSION: ${{ steps.trailbase-version.outputs.version }}
              run: |
                  got="$(trail --version 2>&1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
                  if command -v trail &> /dev/null && [[ "$got" == "$EXPECTED_VERSION" ]]; then
                    echo "valid=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "valid=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Install TrailBase CLI
              if: steps.cache-trailbase.outputs.cache-hit != 'true' || steps.validate-trailbase.outputs.valid != 'true'
              env:
                  TRAILBASE_VERSION: ${{ steps.trailbase-version.outputs.version }}
              run: |
                  curl -sSfL --retry 3 --retry-delay 10 -o /tmp/trailbase.zip \
                    "https://github.com/trailbaseio/trailbase/releases/download/${TRAILBASE_VERSION}/trailbase_${TRAILBASE_VERSION}_x86_64_linux.zip"
                  mkdir -p "$HOME/.local/bin"
                  unzip -oq /tmp/trailbase.zip -d "$HOME/.local/bin" trail
                  chmod +x "$HOME/.local/bin/trail"
                  "$HOME/.local/bin/trail" --version

    seed-xwin:
        name: Seed xwin MSVC CRT/SDK
        # SAME container as the consumer (_build-tauri.yml build-windows):
        # actions/cache versions an entry by path string AND compression
        # method, and both differ between a bare runner (/home/runner/...,
        # zstd) and this image (/__w/..., gzip fallback) — a bare-runner
        # seed is never restorable by the consumer. runs-on mirrors the
        # consumer too; what matters is image + checkout path + cache lib.
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/rust-cross/cargo-zigbuild
        timeout-minutes: 20
        env:
            XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # --- xwin MSVC CRT/SDK (consumer: _build-tauri.yml windows cross-build)
            # Rust setup mirrors the consumer (setup-rust composite with the
            # target) — a bare `rustup target add` is not used: rustup
            # auto-installs the toolchain from rust-toolchain.toml and that
            # path is deprecated for most rustup commands.
            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: x86_64-pc-windows-msvc

            # cargo-binstall install mirrors the setup-frontend composite:
            # presence check first (the composite may already have put it
            # there), same --retry flags on the installer fetch.
            - name: Install cargo-binstall + cargo-xwin
              run: |
                  if command -v cargo-binstall > /dev/null 2>&1; then
                      echo "cargo-binstall already present — skipping installer download"
                  else
                      tmp=$(mktemp)
                      curl -L --retry 5 --retry-delay 2 --retry-all-errors --proto '=https' --tlsv1.2 -sSf -o "$tmp" https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh
                      bash "$tmp"
                  fi
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  cargo binstall cargo-xwin --no-confirm --force

            - name: Cache cargo-xwin MSVC CRT
              id: xwin-cache
              uses: actions/cache@v6
              with:
                  path: ${{ github.workspace }}/.xwin-cache
                  key: xwin-${{ runner.os }}-x86_64-pc-windows-msvc-v17
                  restore-keys: |
                      xwin-${{ runner.os }}-

            # `cargo xwin cache xwin` is the documented pre-download for
            # offline/CI use (cargo-xwin README, "Pre-caching for offline
            # builds"). The previous `cargo xwin download` never existed
            # (exit 2 in both ticks 26-27.11) and the consumer has no
            # separate download step — it warms the cache through the
            # `cargo tauri build --runner cargo-xwin` build itself.
            - name: Download MSVC CRT/SDK (xwin)
              if: steps.xwin-cache.outputs.cache-hit != 'true'
              run: cargo xwin cache xwin

            - name: Assert xwin cache populated
              run: |
                  if [ ! -d "${{ github.workspace }}/.xwin-cache" ] || [ -z "$(find "${{ github.workspace }}/.xwin-cache" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                      echo "::error::xwin cache is empty — CRT/SDK did not download"
                      exit 1
                  fi

    seed-cdn:
        name: Seed CDN data
        runs-on: ubuntu-24.04
        # cdn download alone (~0.56 GB) is the long pole here.
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # --- cdn-data (consumer: download-cdn composite / ci.yml cdn-download)
            - name: Download CDN data
              uses: ./.github/actions/download-cdn
              with:
                  cache-key: cdn-data-v15-${{ hashFiles('end2end/cdn-manifest.txt') }}
                  cdn-base-url: ${{ vars.ORIGA_CDN_BASE_URL }}

    seed-android-gradle:
        name: Seed Gradle cache (Android build)
        runs-on: ubuntu-24.04
        # Cold tick fills the Gradle cache with a real debug APK build
        # (observed 16.5 min on 27.11, toolchain included); 90 is the safe
        # ceiling — a clipped tick cancels the job and post-save would not
        # write, so the seed-forming run would never complete.
        timeout-minutes: 90
        env:
            ORIGA_CDN_BASE_URL: ${{ vars.ORIGA_CDN_BASE_URL }}
            # Mirror of ci.yml android-smoke NDK_VERSION — keep in sync.
            NDK_VERSION: "26.1.10909125"
            # sccache S3 backend, same as ci.yml top-level env: the
            # setup-rust composite reads these (empty on Dependabot —
            # then compilation proceeds uncached, as before the pilot).
            SCCACHE_S3_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
            SCCACHE_S3_SECRET_KEY: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Refresh APT indexes
              run: sudo apt-get update
            - name: Install protobuf-compiler
              # Plain install: the cacheable apt entry is seeded by
              # seed-apt-protobuf (same key); no second master copy here.
              run: sudo apt-get install -y --no-install-recommends protobuf-compiler

            # Mirrors the ci.yml android-smoke setup-rust call (targets
            # only) — no shared-key/save-if: those inputs no longer exist
            # after #976 (actionlint warned on them).
            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown,x86_64-linux-android

            - name: Setup Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21

            - name: Setup Android SDK + NDK
              # Emulator/system-image packages are smoke-only — the build
              # path does not consume them.
              uses: android-actions/setup-android@v4
              with:
                  packages: "platform-tools ndk;${{ env.NDK_VERSION }}"

            - name: Configure NDK environment
              run: |
                  NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
                  if [ ! -d "$NDK_PATH" ]; then
                      echo "::error::NDK directory not found at: $NDK_PATH"
                      ls -1 "${ANDROID_SDK_ROOT}/ndk/" 2>/dev/null || true
                      exit 1
                  fi
                  echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
                  echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

            - name: Cache Gradle
              # Consumer: ci.yml android-smoke — same path/key/restore-keys.
              id: gradle-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*',
                      '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            # Frontend tooling mirrors android-smoke: tauri-cli comes from
            # setup-frontend (cargo subcommand, @tauri-apps/cli from npm).
            - name: Setup frontend tools
              uses: ./.github/actions/setup-frontend

            - name: Add cargo bin to PATH
              run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            # Heavy; unconditional ticks would waste it on every re-run:
            # build only on a gradle cache miss, mirroring the consumer's
            # miss-gated install steps.
            - name: Install Tauri CLI (npm)
              if: steps.gradle-cache.outputs.cache-hit != 'true'
              working-directory: tauri
              run: npm install

            - name: Build landing CSS
              if: steps.gradle-cache.outputs.cache-hit != 'true'
              working-directory: origa_landing
              run: npm ci && npm run build:css

            - name: Build WASM frontend
              if: steps.gradle-cache.outputs.cache-hit != 'true'
              working-directory: origa_ui
              run: trunk build --release
              env:
                  # Same mute as android-smoke's WASM build (ADR-054).
                  UMAMI_DISABLED: "1"

            - name: Build debug APK (fills the Gradle cache)
              if: steps.gradle-cache.outputs.cache-hit != 'true'
              working-directory: tauri
              run: cargo tauri android build --debug --target x86_64 --apk

            - name: Assert Gradle caches populated
              run: |
                  if [ ! -d "$HOME/.gradle/caches" ] || [ -z "$(find "$HOME/.gradle/caches" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                      echo "::error::Gradle caches are empty — the build did not run or populated nothing"
                      exit 1
                  fi
                  du -sh "$HOME/.gradle/caches"
