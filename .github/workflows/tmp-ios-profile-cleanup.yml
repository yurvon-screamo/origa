name: TMP iOS profile cleanup

# TEMPORARY (origa#505): deletes stale IOS_APP_STORE provisioning profiles
# for net.uwuwu.origa so the next xcodebuild -allowProvisioningUpdates run
# creates a fresh profile that includes the Sign in with Apple capability
# (the cached profile predates it, which broke the native SIWA sheet with
# error 1000). DELETE THIS FILE after the green run.

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    cleanup-profiles:
        name: Delete stale iOS App Store profiles
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Decode Apple API Key
              id: decode-key
              uses: ./.github/actions/decode-apple-key
              with:
                  apple-api-key-content: ${{ secrets.APPLE_API_KEY_CONTENT }}
                  apple-api-key: ${{ secrets.APPLE_API_KEY }}

            - name: Delete stale profiles
              env:
                  APPLE_API_KEY_PATH: ${{ steps.decode-key.outputs.key-path }}
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
              run: |
                  python3 .github/scripts/manage_ios_profiles.py \
                    --bundle-id net.uwuwu.origa
