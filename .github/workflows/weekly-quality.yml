name: Quality Coverage

# Coverage net for the `origa` crate (issue #800, ADR-063). Two modes,
# one job:
#
#   * weekly (Mon 04:17 UTC, default branch) — the coverage trend on
#     master. No threshold: a trend, not a gate.
#   * pull_request (core paths only) — uploads coverage for the PR HEAD;
#     Qlty Cloud turns it into the diff-coverage PR comment (Project
#     Settings > Comments > Summary Comments). Information only, never
#     a merge stopper.
#
# The job is deliberately OUTSIDE the CI Gate: a red run is a signal to
# look at, not a merge blocker. On fork/dependabot PRs the publish step
# silently degrades (no secrets) — the artifact upload still works.
#
# The screenshot specs (end2end/screenshots-spec) are NOT here yet: their
# onboarding flow still needs work in a CI-like environment (ADR-063,
# "Not Done Here").
on:
    schedule:
        # Monday, 04:17 UTC. The minute is deliberately non-zero: GitHub
        # deprioritizes scheduled workflows that fire at the top of the hour.
        - cron: "17 4 * * 1"
    workflow_dispatch:
    pull_request:
        branches: [master]
        # Coverage of the core crate: only runs when the core itself (or
        # its dependency manifest) changes. CI/UI-only PRs skip it.
        paths:
            - "origa/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - ".github/workflows/weekly-quality.yml"

permissions:
    contents: read

concurrency:
    # PR runs are grouped per PR (a new push cancels the stale analysis);
    # scheduled and manual runs share the single "default" slot.
    group: quality-coverage-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'default' }}
    cancel-in-progress: true

jobs:
    coverage:
        name: Coverage (origa)
        permissions:
            contents: read
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            ORIGA_CDN_BASE_URL: "https://${{ vars.ORIGA_CDN_URI_PREFIX }}.${{ vars.ORIGA_BASE_URI }}"
            # Read by the Qlty publish step below. Empty (no secret
            # configured) = publishing stays off and the trend lives in
            # the uploaded artifact.
            QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  shared-key: origa-ci-v2
                  save-if: false

            # llvm-profdata and llvm-cov ship in the llvm-tools component;
            # cargo-llvm-cov refuses to run without them.
            - name: Install llvm-tools
              run: rustup component add llvm-tools-preview

            # Pinned: an unpinned "latest" already broke this pipeline once
            # (the wasm-pack action, see ci.yml).
            - name: Install cargo-llvm-cov
              run: cargo install cargo-llvm-cov --version 0.9.1 --locked

            # The origa tests read the real dictionaries and phrase corpus
            # from cdn/ — without the data they fail (and cargo-llvm-cov
            # writes no report when a test target fails).
            - name: Download CDN data
              uses: ./.github/actions/download-cdn
              with:
                  cache-key: cdn-data-v15-${{ hashFiles('end2end/cdn-manifest.txt') }}
                  cdn-base-url: ${{ vars.ORIGA_CDN_BASE_URL }}

            - name: Collect coverage
              run: cargo llvm-cov -p origa --lcov --output-path lcov.info --summary-only

            - name: Upload coverage report
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-lcov
                  path: lcov.info
                  retention-days: 30

            # The Qlty bridge is already configured (.qlty/qlty.toml,
            # [coverage]); it stays dormant until the repository secret
            # QLTY_COVERAGE_TOKEN is set.
            - name: Publish coverage to Qlty
              if: env.QLTY_COVERAGE_TOKEN != ''
              run: |
                  # Canonical installer (the /cli path is a 404). The
                  # version is asserted right after: a silent CLI change
                  # must fail loudly instead of changing the report format.
                  curl -fsSL https://qlty.sh | sh
                  export PATH="$HOME/.qlty/bin:$PATH"
                  qlty --version
                  qlty coverage publish lcov.info --format lcov
