name: Build Tauri App

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            force_apple:
                description: "Force Apple builds (consumes ~30 min of macOS runner per target)"
                type: boolean
                default: false
            force_store_msix:
                description: "Force Microsoft Store MSIX build (smoke-testing outside stable tags)"
                type: boolean
                default: false
            force_flatpak:
                description: "Force Flatpak build (smoke-testing outside stable tags)"
                type: boolean
                default: false

concurrency:
    group: tauri-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

permissions:
    contents: read

jobs:
    version:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            version_base: ${{ steps.version.outputs.version_base }}
            version_type: ${{ steps.version.outputs.version_type }}
            commit_sha: ${{ steps.version.outputs.commit_sha }}
            commit_short: ${{ steps.version.outputs.commit_short }}
            build_date: ${{ steps.version.outputs.build_date }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: Calculate version
              id: version
              uses: ./.github/actions/version

    build-frontend:
        name: Build Frontend
        permissions:
            contents: read
        needs: [version]
        runs-on: ubuntu-24.04
        env:
            ORIGA_VERSION: ${{ needs.version.outputs.version }}
            ORIGA_COMMIT: ${{ needs.version.outputs.commit_sha }}
            ORIGA_BUILD_DATE: ${{ needs.version.outputs.build_date }}
            # Sentry: single DSN shared by both layers (native + WASM); the
            # `layer` scope tag distinguishes them inside the one Sentry
            # project. Empty/unset = Sentry disabled (dev, Dependabot).
            # `SENTRY_ENVIRONMENT` is derived from `version_type` so that
            # stable releases land in `production`, prereleases in `staging`,
            # and master/branch builds in `development`. See ADR-036.
            SENTRY_DSN: ${{ vars.SENTRY_DSN }}
            SENTRY_ENVIRONMENT: ${{ needs.version.outputs.version_type == 'stable' && 'production' || needs.version.outputs.version_type == 'prerelease' && 'staging' || 'development' }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Update version in config files
              uses: ./.github/actions/update-version
              with:
                  version: ${{ needs.version.outputs.version }}

            - name: Cache APT packages
              uses: awalsh128/cache-apt-pkgs-action@v1.6.3
              with:
                  packages:
                      libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                      protobuf-compiler libspeechd-dev
                  version: 1.0

            - name: Setup Rust with caching
              uses: ./.github/actions/setup-rust
              with:
                  targets: wasm32-unknown-unknown
                  shared-key: origa-ci-v2

            - name: Setup frontend tools
              uses: ./.github/actions/setup-frontend
              with:
                  tools: trunk

            - name: Add cargo bin to PATH
              run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

            - name: Build frontend
              working-directory: origa_ui
              run: trunk build --release
              env:
                  TRAILBASE_URL: ${{ vars.TRAILBASE_URL }}
                  ORIGA_CDN_BASE_URL: ${{ vars.ORIGA_CDN_BASE_URL }}
                  ORIGA_CDN_REGION: ${{ vars.ORIGA_CDN_REGION }}

            - name: Upload frontend artifact
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-dist
                  path: origa_ui/dist/
                  retention-days: 1

    build-tauri:
        name: Build Tauri
        needs: [version, build-frontend]
        uses: ./.github/workflows/_build-tauri.yml
        with:
            version: ${{ needs.version.outputs.version }}
            version_base: ${{ needs.version.outputs.version_base }}
            version_type: ${{ needs.version.outputs.version_type }}
            commit_sha: ${{ needs.version.outputs.commit_sha }}
            build_date: ${{ needs.version.outputs.build_date }}
            wasm_artifact_name: frontend-dist
            platforms: "windows,linux,android"
            skip_android: ${{ github.actor == 'dependabot[bot]' }}
        secrets:
            tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || vars.TAURI_CI_DUMMY_PRIVATE_KEY }}
            tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
            android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
            android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

    build-windows-store:
        name: Build Windows Store MSIX
        # Isolation doctrine (mirrors upload-rustore): this job is
        # intentionally ABSENT from release.needs — a transient MSIX build
        # failure MUST NOT block the GitHub Release. Do NOT add
        # build-windows-store to release.needs — that regresses isolation.
        # Stable tags only: the Store is a stable channel, and MSIX versions
        # must be strictly increasing per product (see ADR-042). Smoke-test
        # builds of other refs go through force_store_msix (workflow_dispatch)
        # and produce 0.0.0.<run_number> versions that must never be submitted.
        if: >-
            always() &&
            needs.build-frontend.result == 'success' &&
            ((startsWith(github.ref, 'refs/tags/v') &&
              needs.version.outputs.version_type == 'stable') ||
             inputs.force_store_msix == true) &&
            github.actor != 'dependabot[bot]'
        needs: [version, build-frontend]
        uses: ./.github/workflows/_build-windows-store.yml
        with:
            version: ${{ needs.version.outputs.version }}
            version_type: ${{ needs.version.outputs.version_type }}
            commit_sha: ${{ needs.version.outputs.commit_sha }}
            build_date: ${{ needs.version.outputs.build_date }}
            wasm_artifact_name: frontend-dist

    build-flatpak:
        name: Build Flatpak
        # Linux universal channel (ADR-056): WebKitGTK comes from the GNOME
        # runtime, not from an Ubuntu-built bundle — see the manifest header.
        # Tags only (stable + prerelease); the sandbox build is too heavy for
        # every PR run. `force_flatpak` exists for smoke-testing this job
        # BEFORE the first real tag relies on it.
        # Unlike msix/rustore this job IS a hard gate in release.needs —
        # deliberate exception to the isolation doctrine: flatpak is the
        # primary universal Linux channel (a Linux release without it would
        # ship the deprecated-AppImage experience to everyone). See ADR-056.
        if: >-
            always() &&
            needs.build-frontend.result == 'success' &&
            (startsWith(github.ref, 'refs/tags/v') || inputs.force_flatpak == true) &&
            github.actor != 'dependabot[bot]'
        needs: [version, build-frontend]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        env:
            # Consumed by the manifest-templating step below (python reads
            # os.environ). ORIGA_VERSION/COMMIT/BUILD_DATE are deliberately
            # NOT passed here — the sandbox build derives them from the git
            # tag checkout (see manifest build-commands).
            SENTRY_DSN: ${{ vars.SENTRY_DSN }}
            SENTRY_ENVIRONMENT: ${{ needs.version.outputs.version_type == 'stable' && 'production' || needs.version.outputs.version_type == 'prerelease' && 'staging' || 'development' }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Update version in config files
              uses: ./.github/actions/update-version
              with:
                  version: ${{ needs.version.outputs.version }}

            - name: Download WASM artifact
              uses: actions/download-artifact@v8
              with:
                  name: frontend-dist
                  path: origa_ui/dist/

            - name: Install flatpak + flatpak-builder
              run: |
                  sudo apt-get update
                  sudo apt-get install -y flatpak flatpak-builder
                  flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

            - name: Build flatpak
              # The release metadata (SENTRY_DSN/SENTRY_ENVIRONMENT via job
              # env, ORIGA_APP_STORE) is templated into a copy of the
              # manifest: the flatpak-builder sandbox does not inherit job
              # env. The generated manifest MUST live in the same directory
              # as the original — the relative source paths
              # (../../origa_ui/dist, cargo-sources.json) resolve against
              # the manifest directory. The manifest's git source is pinned
              # to the release tag by update-version above; the frontend
              # dist was built by build-frontend on the same commit
              # (ADR-056).
              run: |
                  python3 - <<'EOF'
                  import os, yaml
                  m = yaml.safe_load(open('packaging/flatpak/net.uwuwu.origa.yml'))
                  mod = next(mo for mo in m['modules'] if mo.get('name') == 'origa')
                  bo_env = mod['build-options'].setdefault('env', {})
                  for key in ('SENTRY_DSN', 'SENTRY_ENVIRONMENT'):
                      if os.environ.get(key):
                          bo_env[key] = os.environ[key]
                  with open('packaging/flatpak/flatpak-manifest.generated.yml', 'w') as f:
                      yaml.safe_dump(m, f, sort_keys=False, allow_unicode=True)
                  EOF
                  flatpak-builder --user \
                      --install-deps-from=flathub \
                      --repo=flatpak-repo \
                      --force-clean \
                      flatpak-build \
                      packaging/flatpak/flatpak-manifest.generated.yml

            - name: Create flatpak bundle
              # Fixed-name alias (ADR-025 addendum): the landing page links
              # /releases/latest/download/Origa_amd64.flatpak. The bundle
              # embeds the runtime-repo reference so a fresh user machine
              # gets the org.gnome.Platform runtime offered automatically.
              run: |
                  flatpak build-bundle \
                      --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
                      flatpak-repo \
                      Origa_amd64.flatpak \
                      net.uwuwu.origa
                  ls -la Origa_amd64.flatpak

            - name: Upload flatpak artifact
              uses: actions/upload-artifact@v7
              with:
                  name: flatpak-build
                  path: Origa_amd64.flatpak
                  retention-days: 7

    build-apple:
        name: Build Apple (iOS + macOS)
        # Apple builds use expensive macOS runners (~30 min/target).
        # Gate on tag push (stable/prerelease), so workflow_dispatch runs do
        # NOT consume macOS minutes.
        # Set `force_apple: true` in workflow_dispatch inputs to override
        # for manual testing / debugging.
        if: >
            always() &&
            needs.build-frontend.result == 'success' &&
            (startsWith(github.ref, 'refs/tags/v') &&
             (needs.version.outputs.version_type == 'stable' ||
              needs.version.outputs.version_type == 'prerelease') ||
             inputs.force_apple == true) &&
            github.actor != 'dependabot[bot]'
        needs: [version, build-frontend]
        uses: ./.github/workflows/_build-tauri-apple.yml
        with:
            version: ${{ needs.version.outputs.version }}
            version_base: ${{ needs.version.outputs.version_base }}
            version_type: ${{ needs.version.outputs.version_type }}
            commit_sha: ${{ needs.version.outputs.commit_sha }}
            build_date: ${{ needs.version.outputs.build_date }}
            wasm_artifact_name: frontend-dist
        secrets:
            apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
            apple-api-key: ${{ secrets.APPLE_API_KEY }}
            apple-api-key-content: ${{ secrets.APPLE_API_KEY_CONTENT }}
            apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
            apple-mac-app-cert-p12: ${{ secrets.APPLE_MAC_APP_CERT_P12 }}
            apple-mac-installer-cert-p12: ${{ secrets.APPLE_MAC_INSTALLER_CERT_P12 }}
            apple-mac-cert-password: ${{ secrets.APPLE_MAC_CERT_PASSWORD }}

    generate-latest-json:
        name: Generate latest.json
        if: startsWith(github.ref, 'refs/tags/v') && needs.version.outputs.version_type == 'stable'
        needs: [version, build-tauri]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Generate latest.json
              env:
                  VERSION: ${{ needs.version.outputs.version }}
                  GIT_TAG: ${{ github.ref_name }}
                  WIN_SIG: ${{ needs.build-tauri.outputs.windows-signature }}
              run: |
                  # Stable-only: prereleases deliberately do NOT refresh the
                  # updater manifest, so users on the stable channel never get
                  # auto-updated to an rc build. The URL tag segment is the git
                  # tag (v-prefixed, e.g. v1.0.0) — it MUST match the release's
                  # tag_name (github.ref_name), not the stripped version. The
                  # asset filename segment is the fixed-name alias
                  # (Origa_x64-setup.exe) — single-naming per ADR-025 addendum;
                  # only the alias asset exists in the release. The manifest's
                  # `version` field is the bare version (1.0.0) the updater
                  # compares against. Signature is content-based (Minisign),
                  # so it stays valid after the versioned → alias rename in
                  # _build-tauri.yml.
                  #
                  # Linux has NO updater entry since ADR-056: the AppImage
                  # channel was retired and Linux distribution is Flatpak +
                  # .deb (updated by re-install / the flatpak repository once
                  # published). A linux-x86_64 entry with a stale signature
                  # and URL would make the updater fail with TargetNotFound
                  # instead of silently skipping.
                  jq -n \
                    --arg version "$VERSION" \
                    --arg notes "Release $VERSION" \
                    --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --arg win_sig "$WIN_SIG" \
                    --arg win_url "https://github.com/yurvon-screamo/origa/releases/download/${GIT_TAG}/Origa_x64-setup.exe" \
                    '{
                      version: $version,
                      notes: $notes,
                      pub_date: $pub_date,
                      platforms: {
                        "windows-x86_64": {
                          signature: $win_sig,
                          url: $win_url
                        }
                      }
                    }' > latest.json
                  cat latest.json

            - name: Upload latest.json artifact
              uses: actions/upload-artifact@v7
              with:
                  name: latest-json
                  path: latest.json
                  retention-days: 7

    release:
        name: Publish Release
        if: >
            always() &&
            needs.build-tauri.result == 'success' &&
            needs.build-flatpak.result == 'success' &&
            startsWith(github.ref, 'refs/tags/v') &&
            (needs.version.outputs.version_type == 'stable' ||
             needs.version.outputs.version_type == 'prerelease') &&
            (needs.version.outputs.version_type != 'stable' ||
             needs.generate-latest-json.result == 'success')
        needs:
            [
                version,
                build-tauri,
                build-flatpak,
                build-apple,
                generate-latest-json,
            ]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts

            - name: Prepare release assets
              run: |
                  mkdir -p release_assets
                  # Keep only installable bundles + the updater manifest. Each
                  # platform ships a single fixed-name asset per ADR-025
                  # addendum (no versioned duplicate) so /releases/latest/download/
                  # <alias> resolves for the landing page. Intermediate artifacts
                  # (frontend-dist WASM, *.sig signatures already embedded into
                  # latest.json) are excluded so the release stays small.
                  # cp -f (not -n): every tag is a fresh release, no accumulation.
                  # macOS ships a productbuild .pkg (signed with the Mac
                  # Installer cert) — there is no .dmg target in this repo;
                  # the stale '*.dmg' pattern never matched. With App Store
                  # upload now stable-only (PR #459), GitHub Release is the
                  # only macOS channel for prereleases.
                  find artifacts -type f \( \
                      -name '*-setup.exe' -o \
                      -name '*.msi' -o \
                      -name '*.flatpak' -o \
                      -name '*.deb' -o \
                      -name '*.pkg' -o \
                      -name '*.apk' -o \
                      -name '*.aab' -o \
                      -name 'latest.json' \
                  \) -exec cp -f {} release_assets/ \;

                  echo "Release assets content:"
                  ls -la release_assets/

            - name: Publish release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ needs.version.outputs.version_type == 'prerelease' && format('Pre-release {0}', needs.version.outputs.version) || format('Release {0}', needs.version.outputs.version) }}
                  body: |
                      ${{ needs.version.outputs.version_type == 'prerelease' && 'Pre-release build — not for the stable update channel.' || format('Release {0}', needs.version.outputs.version) }}

                      Commit: ${{ github.sha }}

                      ## Windows
                      - `Origa_x64-setup.exe` — NSIS installer (single-name, no versioned duplicate per ADR-025 addendum)

                      ## Linux
                      - `Origa_amd64.flatpak` — Flatpak (any distribution; requires flatpak)
                      - `Origa_amd64.deb` — Debian/Ubuntu

                      ### Migrating from the retired AppImage (ADR-056)
                      The AppImage channel was removed — its bundled webview
                      was incompatible with newer distributions. Install the
                      Flatpak (or .deb) and carry your data over with:

                      ```sh
                      mkdir -p ~/.var/app/net.uwuwu.origa/data
                      cp -a ~/.local/share/net.uwuwu.origa ~/.var/app/net.uwuwu.origa/data/
                      ```

                      Note: system-voice TTS inside the Flatpak sandbox uses
                      the host speech-dispatcher daemon (needs `speechd`
                      running on the host); phrase audio from the CDN is
                      unaffected.

                      ## iOS
                      ${{ needs.build-apple.outputs.ios-upload-status == 'success' && '- App Store: install via TestFlight (see App Store Connect)' || '- ⚠️ iOS upload FAILED — check CI logs. Download ios-build artifact and upload via Transporter.app' }}

                      ## macOS
                      ${{ needs.build-apple.outputs.macos-upload-status == 'success' && '- App Store: install via TestFlight (see App Store Connect)' || '- ⚠️ macOS upload FAILED — check CI logs. Download macos-pkg-build artifact and upload via Transporter.app' }}

                      ## Android
                      - `origa.apk`
                      - `origa-${{ needs.version.outputs.version }}.aab` — App Bundle for Google Play Console upload

                      ## Updater
                      - `latest.json` — Tauri updater manifest (stable releases only)
                  generate_release_notes: true
                  files: release_assets/*
                  prerelease: ${{ needs.version.outputs.version_type == 'prerelease' }}
                  draft: false
                  make_latest: ${{ needs.version.outputs.version_type == 'stable' }}

    upload-rustore:
        name: Upload to RuStore
        # Stable-only: only v*.*.* stable tags publish to RuStore; prerelease
        # (RC) and alpha are intentionally excluded — RC still ships to GitHub
        # Release via the `release` job.
        #
        # Intentionally NOT a dependency of `release`: this job is absent from
        # release.needs ([version, build-tauri, build-flatpak, build-apple,
        # generate-latest-json]).
        # Transient RuStore failures (network, stale drafts, moderation quirks)
        # even on a stable release MUST NOT block the GitHub Release.
        # Do NOT add upload-rustore to release.needs — that regresses isolation.
        if: >
            always() &&
            needs.build-tauri.result == 'success' &&
            startsWith(github.ref, 'refs/tags/v') &&
            needs.version.outputs.version_type == 'stable'
        needs: [version, build-tauri]
        uses: ./.github/workflows/_upload-rustore.yml
        with:
            version: ${{ needs.version.outputs.version }}
            version_type: ${{ needs.version.outputs.version_type }}
        secrets:
            rustore-key-id: ${{ secrets.RUSTORE_KEY_ID }}
            rustore-private-key: ${{ secrets.RUSTORE_PRIVATE_KEY }}
