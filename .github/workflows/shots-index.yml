name: Shots Index

# The registry index (docs/ui-screenshots/README.md) is a generated view
# over docs/ui-screenshots/shots/*.json. Capture PRs commit the JSON
# entries but NOT the view — after every registry merge this workflow
# regenerates the view and lands it on master. Hand-merging the index in
# parallel PRs was a conflict magnet and even lost registry rows, so the
# view now has a single writer (task #409 of the origa board).
#
# The landing goes through a PR created with the SHOTS_BOT_TOKEN
# personal access token, not the GITHUB_TOKEN: a repository's
# GITHUB_TOKEN cannot create pull requests unless the repo setting
# "Allow GitHub Actions to create and approve pull requests" is on, and
# even with it, CI on GITHUB_TOKEN-created PRs sits in the
# approval-required state until a user clicks "Approve workflows to
# run" on every PR and force-push (GitHub Docs, "Triggering a workflow"
# → "Triggering a workflow from a workflow"). A PAT-created PR runs CI
# automatically: the PR only ever touches the generated file — no
# ci.yml path-filter component matches, every run_* flag stays false —
# so the fail-closed gate passes on its own and auto-merge lands it.
on:
    push:
        branches: [master]
        paths:
            - "docs/ui-screenshots/shots/**"
            # Code that shapes the view: a template or reader change must
            # regenerate the index too, not wait for the next capture.
            - "end2end/scripts/shots.ts"
            - "end2end/shots/index.ts"
            - "end2end/shots/registry.ts"
    workflow_dispatch:

concurrency:
    group: shots-index
    # Serialize rebuilds: a single run owns the landing at any moment,
    # and each run re-cuts the bot branch from a fresh master, so the
    # last run always converges to the truth.
    cancel-in-progress: false

# The landing (branch push, PR create, auto-merge) runs on the PAT;
# the GITHUB_TOKEN here only reads.
permissions:
    contents: read

jobs:
    rebuild:
        name: Rebuild the registry index
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout master
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # Fresh HEAD, not the event SHA: a serialized run must
                  # see the previous run's landed rebuild, if any.
                  ref: master
                  # The PAT persists as the push credential for the bot
                  # branch; an empty secret (not configured yet) falls
                  # back to the default token and the landing step below
                  # fails with setup instructions.
                  token: ${{ secrets.SHOTS_BOT_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  # Node 22: the shots tool runs on type stripping
                  # (Node >= 22.18), same as the e2e jobs in ci.yml.
                  node-version: "22"

            - name: Install dependencies
              working-directory: end2end
              run: npm ci

            - name: Rebuild and land the index
              env:
                  GH_TOKEN: ${{ secrets.SHOTS_BOT_TOKEN }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                      echo "::error::secret SHOTS_BOT_TOKEN is not set — the landing needs a personal access token (fine-grained, this repo only: Contents read/write + Pull requests read/write)."
                      echo "::error::One-time setup: create the token, then run 'gh secret set SHOTS_BOT_TOKEN' on this repository. GITHUB_TOKEN cannot create PRs here, and CI on its PRs would need a manual approval click."
                      exit 1
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  # Single writer: the concurrency group serializes runs,
                  # merged bot branches are auto-deleted, so a plain
                  # force push cannot clobber a concurrent update.
                  # Master can still move while this run works (the
                  # previous run's bot PR merges mid-flight); the loop
                  # detects that and re-cuts the branch from the fresh
                  # HEAD, up to 3 attempts.
                  attempt=1
                  landed=""
                  while [ "$attempt" -le 3 ]; do
                      git fetch origin master --quiet
                      git reset --hard origin/master --quiet
                      base="$(git rev-parse HEAD)"

                      (cd end2end && node scripts/shots.ts index)

                      if git diff --quiet docs/ui-screenshots/README.md; then
                          echo "Index already matches the registry on master ($base) — nothing to land."
                          exit 0
                      fi

                      git add docs/ui-screenshots/README.md
                      git commit --quiet -m "chore(shots): regenerate the registry index (post-merge rebuild)"
                      git push --force origin "HEAD:refs/heads/bot/shots-index"
                      echo "Pushed bot/shots-index ($(git rev-parse --short HEAD), base $(git rev-parse --short "$base")), attempt $attempt."

                      git fetch origin master --quiet
                      if [ "$(git rev-parse origin/master)" = "$base" ]; then
                          landed="yes"
                          break
                      fi
                      echo "Master moved while landing — re-cutting from the fresh HEAD."
                      attempt=$((attempt + 1))
                  done

                  if [ -z "$landed" ]; then
                      echo "::error::master kept moving during landing — giving up after 3 attempts. Rerun the workflow; the next shots merge heals this anyway."
                      exit 1
                  fi

                  number="$(gh pr list --head bot/shots-index --state open --json number --jq '.[0].number // ""')"
                  if [ -z "$number" ]; then
                      gh pr create \
                          --base master \
                          --head bot/shots-index \
                          --title "chore(shots): regenerate the registry index" \
                          --body "Auto-landed by the Shots Index workflow (\`npm run shots -- index\`) after a registry merge. The index is a generated view — do not edit."
                  else
                      echo "Bot PR #$number is already open — branch updated, re-arming auto-merge."
                  fi
                  gh pr merge --merge --auto
