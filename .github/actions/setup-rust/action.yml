name: "Setup Rust"
description: "Setup Rust toolchain with sccache (S3-compatible compile cache)"

inputs:
    targets:
        description: 'Comma-separated list of targets (e.g. "x86_64-unknown-linux-gnu,wasm32-unknown-unknown")'
        required: false
        default: ""

runs:
    using: "composite"
    steps:
        # The toolchain version lives in rust-toolchain.toml (repo root) —
        # the same carrier rustup and both Dockerfiles read. Install exactly
        # the pinned channel instead of a floating @stable ref: the lint set
        # of the gate must not drift until a deliberate bump PR (task
        # origa#1056).
        - name: Resolve pinned toolchain channel
          id: toolchain
          run: |
              channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
              echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"
          shell: bash

        - name: Setup Rust toolchain
          uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
          with:
              toolchain: ${{ steps.toolchain.outputs.channel }}
              targets: ${{ inputs.targets }}
              # The action installs with --profile minimal; clippy and
              # rustfmt must be requested explicitly. With the old floating
              # @stable ref this was invisible: the runners' preinstalled
              # stable already carried both components, so the install was
              # a no-op. A pinned channel installs fresh — without this
              # line cargo fmt/clippy fail with "not installed".
              components: clippy, rustfmt

        # Fail loud if the pin did not take (a silent fallback to whatever
        # stable the runner preinstalls would reopen the drift class this
        # wiring exists to close).
        - name: Assert active toolchain matches the pin
          run: |
              channel="${{ steps.toolchain.outputs.channel }}"
              active="$(rustup show active-toolchain)"
              case "$active" in
                  "$channel"-* | "$channel") echo "active toolchain: $active" ;;
                  *) echo "::error::active toolchain '$active' does not match the pinned channel '$channel' from rust-toolchain.toml"; exit 1 ;;
              esac
          shell: bash

        - name: Install sccache
          # Pinned by SHA + compiler version: cache keys are version-specific,
          # and release tag builds must not pick up a new sccache silently.
          uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
          with:
              version: "v0.20.1"

        # SCCACHE_S3_* arrive as job env from the caller workflow (composite
        # actions cannot read the secrets context). Dependabot PRs cannot
        # access repo secrets — the vars resolve empty and compilation
        # proceeds uncached, exactly as before the sccache pilot (#1495).
        - name: Enable sccache (S3 backend)
          shell: bash
          run: |
              if [ -z "$SCCACHE_S3_ACCESS_KEY_ID" ] || [ -z "$SCCACHE_S3_SECRET_KEY" ]; then
                  echo "sccache S3 credentials unavailable — compiling uncached"
                  exit 0
              fi
              # CARGO_INCREMENTAL=0 unconditionally: incremental compilation
              # units are not cacheable, and one mixed-cached run would poison
              # hits for everyone else sharing the bucket.
              {
                  echo "CARGO_INCREMENTAL=0"
                  echo "RUSTC_WRAPPER=sccache"
                  # Release the sccache server before long browser-test phases
                  # (wasm-bindgen tests run Chrome in the same job): the old
                  # 10-minute idle window keeps the server resident there.
                  echo "SCCACHE_IDLE_TIMEOUT=60"
                  # Bound the local disk L1: with a remote backend it is only
                  # a per-job cache, and GH runners are disk-tight.
                  echo "SCCACHE_CACHE_SIZE=2G"
                  echo "SCCACHE_BUCKET=origa-sccache"
                  echo "SCCACHE_ENDPOINT=https://t3.storage.dev"
                  echo "SCCACHE_REGION=auto"
                  # S3-compatible backends: checksums only where operations
                  # require them — recent AWS SDKs default to trailing
                  # CRC32 that not every backend parses.
                  echo "AWS_REQUEST_CHECKSUM_CALCULATION=when_required"
                  echo "AWS_RESPONSE_CHECKSUM_CALCULATION=when_required"
                  echo "AWS_ACCESS_KEY_ID=$SCCACHE_S3_ACCESS_KEY_ID"
                  echo "AWS_SECRET_ACCESS_KEY=$SCCACHE_S3_SECRET_KEY"
              } >> "$GITHUB_ENV"
