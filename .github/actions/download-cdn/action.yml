name: "Download CDN Data"
description: "Download and cache CDN test data with integrity verification"

inputs:
  cache-key:
    description: "Cache key prefix"
    required: false
    default: "cdn-data-v15"
  cdn-base-url:
    description: "CDN base URL for downloading files"
    required: true

runs:
  using: "composite"
  steps:
    - name: Cache CDN data
      uses: actions/cache@v4
      id: cache-cdn
      with:
        path: cdn
        key: ${{ inputs.cache-key }}

    - name: Verify cached data
      id: verify
      shell: bash
      env:
        CDN_BASE: ${{ inputs.cdn-base-url }}
      run: |
        set -euo pipefail
        VERIFY="$GITHUB_ACTION_PATH/scripts/verify_cdn_integrity.py"

        if [ "${{ steps.cache-cdn.outputs.cache-hit }}" != "true" ]; then
          echo "cache_miss=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Cache hit — verifying integrity..."

        # A poisoned cache entry (e.g. saved after a partial download) must be
        # caught here: any missing/empty file from cdn-manifest.txt invalidates it.
        if ! python3 "$VERIFY" --cdn-dir cdn --file-list end2end/cdn-manifest.txt; then
          echo "Cache incomplete — discarding and re-downloading"
          rm -rf cdn
          echo "cache_miss=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Freshness: compare cached SHA256 against the fresh prod manifest.
        # A transient manifest download failure must NOT discard a valid cache.
        if ! curl -sSf --connect-timeout 10 --max-time 30 -o /tmp/fresh_manifest.json "${CDN_BASE}/manifest.json"; then
          echo "WARN: Could not download fresh manifest, keeping cache"
          echo "cache_miss=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! python3 "$VERIFY" --cdn-dir cdn --file-list end2end/cdn-manifest.txt --hash-manifest /tmp/fresh_manifest.json; then
          echo "Cache stale — discarding and re-downloading"
          rm -rf cdn
          echo "cache_miss=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Cache verified fresh"
        echo "cache_miss=false" >> "$GITHUB_OUTPUT"

    - name: Download CDN data
      if: steps.verify.outputs.cache_miss == 'true'
      shell: bash
      env:
        CDN_BASE: ${{ inputs.cdn-base-url }}
      run: |
        set -euo pipefail

        # Stall detection instead of a hard per-attempt timeout: large files
        # (whisper .onnx, ~150 MB) survive slow-but-alive transfers, while a
        # dead transfer aborts after 60 s below 10 KB/s. The absolute cap
        # still bounds the worst case per attempt (issue #544).
        CURL_OPTS=(--connect-timeout 10 --speed-limit 10240 --speed-time 60 --max-time 900)

        dl() {
          local file="$1"
          local url="$2"
          local retries=3
          for i in $(seq 1 $retries); do
            if curl -sSf "${CURL_OPTS[@]}" -o "$file" "$url" && [ -s "$file" ]; then
              return 0
            fi
            echo "Retry $i/$retries for $(basename "$file")"
            rm -f "$file"
            sleep $((i * 5))
          done
          echo "FAILED: $file after $retries attempts"
          return 1
        }

        # Manifest lines are paths; blank lines and # markers (FONTS-START/END,
        # consumed by scripts/subset_fonts.py) must never be downloaded.
        # Counts lines, so duplicated manifest entries are counted twice; the
        # integrity script counts unique paths (a set) and reports lower totals.
        TOTAL=$(grep -cv -e '^[[:space:]]*$' -e '^[[:space:]]*#' end2end/cdn-manifest.txt || true)
        echo "Downloading $TOTAL CDN files from manifest..."
        OK=0
        FAIL=0
        while IFS= read -r path; do
          # Trim leading/trailing whitespace to match the Python parser's
          # strip() (verify_cdn_integrity.py); a whitespace-only line must be
          # skipped, not downloaded as an empty path.
          path="${path#"${path%%[![:space:]]*}"}"
          path="${path%"${path##*[![:space:]]}"}"
          case "$path" in ''|\#*) continue ;; esac
          mkdir -p "cdn/$(dirname "$path")"
          if dl "cdn/$path" "${CDN_BASE}/$path"; then
            OK=$((OK + 1))
          else
            FAIL=$((FAIL + 1))
          fi
        done < end2end/cdn-manifest.txt
        echo "Downloaded $OK/$TOTAL files ($FAIL failed)"

        # Fail loud: a silently incomplete cdn/ used to reach the e2e jobs
        # (issue #544) and, once cached, poisoned every subsequent run.
        if [ "$FAIL" -gt 0 ]; then
          echo "FATAL: $FAIL/$TOTAL manifest files failed to download"
          exit 1
        fi

    - name: Final verification
      shell: bash
      run: |
        set -euo pipefail
        echo "Verifying CDN data..."
        ERRORS=0

        # Single choke-point invariant (issue #544): cdn/ ⊇ cdn-manifest.txt
        # (present and non-empty) plus SHA256 of every manifest.json entry the
        # mirror downloads. Runs on both cache-hit and fresh-download paths.
        if ! python3 "$GITHUB_ACTION_PATH/scripts/verify_cdn_integrity.py" \
          --cdn-dir cdn --file-list end2end/cdn-manifest.txt \
          --hash-manifest cdn/manifest.json; then
          ERRORS=$((ERRORS + 1))
        fi

        # Size checks for other critical files
        declare -A MIN_SIZES
        MIN_SIZES["well_known_set/well_known_sets_meta.json"]=100000
        MIN_SIZES["well_known_set/well_known_types_meta.json"]=100
        MIN_SIZES["dictionaries/sudachidict-20260723/metadata.json"]=100
        MIN_SIZES["manifest.json"]=100
        MIN_SIZES["dictionaries/JmdictFurigana.txt"]=1000
        MIN_SIZES["phrases/phrase_index.json"]=100
        MIN_SIZES["pitch/index.json"]=100
        # Truncation guards for the large ML models (not hash-covered).
        MIN_SIZES["whisper/onnx/encoder_model.onnx"]=10000000
        MIN_SIZES["whisper/onnx/decoder_model.onnx"]=50000000
        MIN_SIZES["whisper/tokenizer.json"]=1000000

        for f in "${!MIN_SIZES[@]}"; do
          min_size=${MIN_SIZES[$f]}
          if [ ! -s "cdn/$f" ]; then
            echo "ERROR: cdn/$f is missing or empty!"
            ERRORS=$((ERRORS + 1))
            continue
          fi
          actual_size=$(wc -c < "cdn/$f")
          if [ "$actual_size" -lt "$min_size" ]; then
            echo "ERROR: cdn/$f too small ($actual_size < $min_size) — corrupted!"
            ERRORS=$((ERRORS + 1))
          else
            echo "  OK: cdn/$f ($actual_size bytes)"
          fi
        done

        # Self-hosted fonts (ADR-028): the download loop and the integrity
        # script already guarantee every cdn-manifest path exists, but the
        # subset is asserted explicitly here because the deployed woff2 files
        # carry hashed names that are globbed. A missing deploy or a stale
        # cdn-data cache is caught before E2E renders Chinese fallback glyphs.
        FONT_COUNT=$(find cdn/fonts -name '*.woff2' 2>/dev/null | wc -l)
        if [ "$FONT_COUNT" -lt 7 ]; then
          echo "ERROR: expected >=7 woff2 in cdn/fonts/, found $FONT_COUNT"
          ERRORS=$((ERRORS + 1))
        fi
        for f in cdn/fonts/noto-*-jp-400-*.woff2; do
          if [ ! -s "$f" ]; then
            echo "ERROR: missing or empty Noto JP font: $f"
            ERRORS=$((ERRORS + 1))
          elif [ "$(wc -c < "$f")" -lt 100000 ]; then
            echo "ERROR: $f too small — corrupted subset!"
            ERRORS=$((ERRORS + 1))
          else
            echo "  OK: $f ($(wc -c < "$f") bytes)"
          fi
        done

        if [ "$ERRORS" -gt 0 ]; then
          echo "FATAL: $ERRORS critical files failed verification"
          exit 1
        fi
        echo "All critical CDN files verified."
