name: "Calculate Version"
description: "Compute version, commit info, and build date from git tags and branch state"

outputs:
    version:
        description: "Full version (0.3.0 or 0.2.1-alpha.3)"
        value: ${{ steps.calc.outputs.version }}
    version_base:
        description: "Base version without suffix (0.3.0 or 0.2.1)"
        value: ${{ steps.calc.outputs.version_base }}
    version_type:
        description: "Version type (stable, prerelease, or alpha)"
        value: ${{ steps.calc.outputs.version_type }}
    commit_sha:
        description: "Full commit SHA"
        value: ${{ steps.calc.outputs.commit_sha }}
    commit_short:
        description: "Short commit SHA (7 chars)"
        value: ${{ steps.calc.outputs.commit_short }}
    build_date:
        description: "Build date (YYYY-MM-DD)"
        value: ${{ steps.calc.outputs.build_date }}

runs:
    using: "composite"
    steps:
        - name: Verify git history
          shell: bash
          run: |
              if ! git rev-parse HEAD~1 &>/dev/null; then
                echo "::error::Shallow clone detected. Use fetch-depth: 0 in checkout."
                exit 1
              fi

        - name: Calculate version
          id: calc
          shell: bash
          run: |
              COMMIT_SHA="${{ github.sha }}"
              COMMIT_SHORT="${COMMIT_SHA:0:7}"
              BUILD_DATE=$(date -u +'%Y-%m-%d')

              echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
              echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
              echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

              REF_TYPE="${{ github.ref_type }}"
              REF_NAME="${{ github.ref_name }}"

              # Stable: vX.Y.Z — numeric only, no pre-release suffix.
              if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                VERSION="${REF_NAME#v}"
                VERSION_BASE="${VERSION}"
                VERSION_TYPE="stable"
              # Prerelease: vX.Y.Z-rcN — trailing digit required, so a bare
              # "rc" falls through to alpha. The rc-segment regex accepts ONLY
              # pure positive digits without leading zeros — the core contract
              # shared with .github/scripts/compute-android-versioncode.sh
              # (the Play versionCode offset: leading-zero and dotted forms
              # would collide or have no monotonic mapping; the script caps
              # the offset at 98, reserving 99 for the stable of the train).
              # Exotic TAG forms (rc0/rc01, rc.1, beta1) fall into the alpha
              # branch and are rejected there fail-loud (see below); branch
              # builds keep the tolerant describe-based derivation.
              elif [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc([1-9][0-9]*)$ ]]; then
                VERSION="${REF_NAME#v}"
                VERSION_BASE="${VERSION%%-rc*}"
                VERSION_TYPE="prerelease"
              else
                VERSION_TYPE="alpha"

                LATEST_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")

                if [[ -z "$LATEST_TAG" ]]; then
                  MAJOR=0
                  MINOR=1
                  PATCH=0
                  COMMIT_COUNT=0
                else
                  TAG_VERSION="${LATEST_TAG#v}"

                  # A TAG run reaching the alpha branch carries an
                  # unrecognized tag form (not vX.Y.Z, not vX.Y.Z-rcN) —
                  # operator error, reject loud instead of misversioning.
                  # BRANCH runs must stay tolerant: the latest reachable tag
                  # may legitimately be an rc (vX.Y.Z-rcN), whose base
                  # X.Y.(Z+1) is exactly the next alpha train — parsed
                  # explicitly below instead of by arithmetic accident.
                  if [[ "$REF_TYPE" == "tag" && ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::unrecognized release tag form: '$REF_NAME' (latest tag '$LATEST_TAG' is not vX.Y.Z) — use vX.Y.Z or vX.Y.Z-rcN" >&2
                    exit 1
                  fi

                  IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG_VERSION%%-rc*}"

                  MAJOR=${MAJOR:-0}
                  MINOR=${MINOR:-0}
                  PATCH=${PATCH:-0}

                  PATCH=$((PATCH + 1))

                  COMMIT_COUNT=$(git rev-list --count "${LATEST_TAG}..HEAD")
                fi

                VERSION_BASE="${MAJOR}.${MINOR}.${PATCH}"
                VERSION="${VERSION_BASE}-alpha.${COMMIT_COUNT}"
              fi

              echo "version=${VERSION}" >> $GITHUB_OUTPUT
              echo "version_base=${VERSION_BASE}" >> $GITHUB_OUTPUT
              echo "version_type=${VERSION_TYPE}" >> $GITHUB_OUTPUT
