name: "Setup Frontend"
description: "Install cargo-binstall, trunk, tauri-cli"

inputs:
    tools:
        description: "Space-separated list of tools to install via cargo-binstall"
        required: false
        default: "trunk tauri-cli"

runs:
    using: "composite"
    steps:
        - name: Install cargo-binstall
          shell: bash
          run: |
              tmp=$(mktemp) && curl -L --proto '=https' --tlsv1.2 -sSf -o "$tmp" https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh && bash "$tmp"

        - name: Add cargo bin to PATH
          shell: bash
          run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

        - name: Install tools via cargo-binstall
          shell: bash
          run: |
              # Binary-first install; the source-build fallback goes through
              # `cargo install --locked` — the registry broke trunk's
              # unpinned deps before (cssparser 0.35 vs lightningcss alpha).
              set +e
              cargo binstall ${{ inputs.tools }} --no-confirm --force \
                --disable-strategies compile
              status=$?
              set -e
              if [ $status -ne 0 ]; then
                echo "binstall binary unavailable — falling back to cargo install --locked"
                for tool in ${{ inputs.tools }}; do
                  cargo install "$tool" --locked --force
                done
              fi

        - name: Verify trunk installation
          if: contains(inputs.tools, 'trunk')
          shell: bash
          run: |
              which trunk
              trunk --version

        - name: Cache trunk tools
          id: trunk-cache
          if: contains(inputs.tools, 'trunk')
          uses: actions/cache@v4
          with:
              path: ~/.cache/trunk
              key: trunk-tools-v2

