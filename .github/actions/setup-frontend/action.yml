name: "Setup Frontend"
description: "Install cargo-binstall, trunk, tauri-cli"

inputs:
    tools:
        description: "Space-separated list of tools to install via cargo-binstall"
        required: false
        default: "trunk tauri-cli"

runs:
    using: "composite"
    steps:
        - name: Install cargo-binstall
          shell: bash
          run: |
              tmp=$(mktemp) && curl -L --proto '=https' --tlsv1.2 -sSf -o "$tmp" https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh && bash "$tmp"

        - name: Add cargo bin to PATH
          shell: bash
          run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

        - name: Install tools via cargo-binstall
          shell: bash
          run: |
              # --locked on the source-build fallback: the registry broke
              # trunk's unpinned deps twice already (cssparser 0.35 vs
              # lightningcss alpha). Binary installs ignore the flag.
              cargo binstall ${{ inputs.tools }} --no-confirm --force \
                --cargo-install-args "--locked"

        - name: Verify trunk installation
          if: contains(inputs.tools, 'trunk')
          shell: bash
          run: |
              which trunk
              trunk --version

        - name: Cache trunk tools
          id: trunk-cache
          if: contains(inputs.tools, 'trunk')
          uses: actions/cache@v4
          with:
              path: ~/.cache/trunk
              key: trunk-tools-v2

