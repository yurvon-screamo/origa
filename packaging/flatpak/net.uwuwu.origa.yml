# Flatpak manifest for the Origa desktop app (Linux distribution channel).
#
# Rationale (ADR-056): the AppImage channel bundles an Ubuntu-built
# WebKitGTK that breaks on rolling distributions with new GPUs/Mesa
# (empty window, WebKitWebProcess dies at spawn). Flatpak takes
# WebKitGTK from the GNOME runtime instead — kept current by upstream
# and GPU-agnostic. The .deb channel (system WebKitGTK) is unaffected.
#
# Release flow: the `tag:` below is bumped by the `update-version`
# composite action together with Cargo.toml / tauri.conf.json, so the
# manifest always builds the tag being released.
id: net.uwuwu.origa
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
    - org.freedesktop.Sdk.Extension.rust-stable
    - org.freedesktop.Sdk.Extension.llvm20
command: origa-app
finish-args:
    - --socket=wayland
    - --socket=fallback-x11
    - --device=dri
    - --share=ipc
    - --share=network
    # TTS audio output (speech-dispatcher talks to the host daemon
    # through its socket in XDG_RUNTIME_DIR) and microphone capture
    # for pronunciation practice.
    - --socket=pulseaudio
    - --filesystem=xdg-run/speech-dispatcher
cleanup:
    - /include
    - /lib/cmake
    - /lib/pkgconfig
    - '*.a'
    - '*.la'
modules:
    - name: dotconf
      buildsystem: simple
      build-commands:
          # 1.4.1 ships as a git snapshot (no generated configure).
          - tar -xzf dotconf_1.4.1.orig.tar.gz
          - cd dotconf-1.4.1 && autoreconf -fi && ./configure --prefix=/app --disable-static && make && make install
      sources:
          - type: file
            only-arches:
                - x86_64
            url: https://deb.debian.org/debian/pool/main/d/dotconf/dotconf_1.4.1.orig.tar.gz
            sha256: 5922c46cacf99b2ecc4853d28a2bda4a489292e73276e604bd9cba29dfca892d

    # speech-dispatcher CLIENT library: the sandboxed app talks to the
    # HOST speech-dispatcher daemon over the XDG_RUNTIME_DIR socket
    # (granted in finish-args). Server parts and audio backends are
    # unnecessary and disabled.
    - name: speech-dispatcher
      buildsystem: simple
      build-commands:
          # Client library only: server parts + audio backends disabled.
          - tar -xzf speech-dispatcher_0.12.1.orig.tar.gz
          - cd speech-dispatcher-0.12.1 && ./configure --prefix=/app --disable-static --disable-python --without-espeak-ng --without-pulse --without-alsa --without-libao --without-flite --without-baratinoo --without-kali --without-pico --without-voxin --without-cicero --without-dtk --without-mary && make && make install
      sources:
          - type: file
            only-arches:
                - x86_64
            url: https://deb.debian.org/debian/pool/main/s/speech-dispatcher/speech-dispatcher_0.12.1.orig.tar.gz
            sha256: b14a5238d287d2dcce4dd42bbd66ca65fa228e7e683708267f7b34036f7ba4b4

    - name: origa
      buildsystem: simple
      build-options:
          append-path: /usr/lib/sdk/rust-stable/bin
          env:
              # Keep cargo/trunk caches and homes inside the writable
              # build dir.
              HOME: /run/build/origa
              CARGO_HOME: /run/build/origa/cargo-home
              # speech-dispatcher client (module above, installed into /app):
              # bindgen include path + linker search path.
              BINDGEN_EXTRA_CLANG_ARGS: -I/app/include -I/usr/lib/sdk/llvm20/lib/clang/20/include
              RUSTFLAGS: -L/app/lib
              LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
              # Managed-distribution gate (reuses the MSIX mechanism,
              # ADR-042): compiles the Tauri updater out and hides the
              # in-app update UI. Flatpak/Flathub forbid self-updating
              # apps; updates arrive as a new published bundle.
              # See ADR-056.
              ORIGA_APP_STORE: '1'
      sources:
          - type: git
            url: https://github.com/yurvon-screamo/origa.git
            tag: v0.7.19
          # Prebuilt frontend (WASM + assets), produced by build-frontend
          # from the same commit.
          - type: dir
            path: ../../origa_ui/dist
            dest: origa_ui/dist
          # Point cargo at the vendored crates: the generator emits a full
          # source-replacement config (registry + git deps) at
          # cargo/config — merge it into the committed .cargo/config.toml.
          - cargo-sources.json
      build-commands:
          - cat cargo/config >> .cargo/config.toml
          # Build metadata derived from the checked-out tag (the manifest's
          # git source); feeds the in-app version display and SENTRY_RELEASE
          # (tauri/build.rs). SENTRY_DSN is injected by the CI job via a
          # templated copy of this manifest (see build-flatpak).
          - |
              export ORIGA_VERSION="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//' || true)"
              export ORIGA_COMMIT="$(git rev-parse HEAD 2>/dev/null || true)"
              export ORIGA_BUILD_DATE="$(git log -1 --format=%cd --date=short 2>/dev/null || true)"
              export ORIGA_VERSION="${ORIGA_VERSION:-0.0.0}" ORIGA_COMMIT="${ORIGA_COMMIT:-unknown}" ORIGA_BUILD_DATE="${ORIGA_BUILD_DATE:-unknown}"
              echo "Building Origa $ORIGA_VERSION ($ORIGA_COMMIT, $ORIGA_BUILD_DATE)"
              # -p origa-app: the shell crate only. A workspace-wide build
              # would pull the `origa` core crate (ort/onnxruntime, which
              # downloads prebuilt binaries — impossible offline) and the
              # WASM crates — none of which the desktop shell links.
              cargo build --release --offline -p origa-app --features tauri/custom-protocol
          - install -Dm755 target/release/origa-app /app/bin/origa-app
          - install -Dm644 tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/net.uwuwu.origa.png
          - install -Dm644 tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/net.uwuwu.origa.png
          - install -Dm644 tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/net.uwuwu.origa.png
          - install -Dm644 tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/net.uwuwu.origa.png
          - install -Dm644 tauri/icons/icon-512.png /app/share/icons/hicolor/512x512/apps/net.uwuwu.origa.png
          - install -Dm644 packaging/flatpak/net.uwuwu.origa.desktop /app/share/applications/net.uwuwu.origa.desktop
          # Label the appstream release with the version being built (the
          # tag checkout carries the PREVIOUS release's version — update-version
          # only seds the workspace copy, which the sandbox never sees).
          - |
              V="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//' || true)"; V="${V:-0.0.0}"
              D="$(git log -1 --format=%cd --date=short 2>/dev/null || true)"; D="${D:-1970-01-01}"
              sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"/>|<release version=\"${V}\" date=\"${D}\"/>|" packaging/flatpak/net.uwuwu.origa.metainfo.xml
              grep -q "version=\"${V}\"" packaging/flatpak/net.uwuwu.origa.metainfo.xml || { echo "::error::metainfo version sed did not apply"; exit 1; }
          - install -Dm644 packaging/flatpak/net.uwuwu.origa.metainfo.xml /app/share/metainfo/net.uwuwu.origa.metainfo.xml
          - desktop-file-validate /app/share/applications/net.uwuwu.origa.desktop
